<style>
/* Layout: navy header band with name and contact; below, a classic two-column résumé — profile sidebar (sticky on desktop) and main content; one column on phones */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1B2433; --muted:#5B6575; --line:#E1E5EB;
  --brand:#14325C; --brand-ink:#FFFFFF; --brand-muted:#B9C6DA; --accent:#1F5FAD; --accent-soft:#E8F0FA;
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#161D27; --ink:#E4E8EE; --muted:#9AA4B3; --line:#263040;
  --brand:#14233A; --brand-ink:#F1F4F8; --brand-muted:#9FB0C8; --accent:#7FB0EC; --accent-soft:#1A2A40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#161D27; --ink:#E4E8EE; --muted:#9AA4B3; --line:#263040;
  --brand:#14233A; --brand-ink:#F1F4F8; --brand-muted:#9FB0C8; --accent:#7FB0EC; --accent-soft:#1A2A40; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.6;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header band */
.band{background:var(--brand);color:var(--brand-ink)}
.band .wrap{padding-block:36px 32px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.mono{width:76px;height:76px;border-radius:50%;border:2px solid var(--brand-muted);display:grid;place-items:center;font-weight:600;font-size:26px;letter-spacing:.02em}
.band h1{margin:0;font-size:clamp(26px,3.6vw,36px);font-weight:600;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.band .role{margin:6px 0 0;color:var(--brand-muted);font-size:16px}
.band .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:var(--brand-muted)}
.lang{display:flex;border:1px solid var(--brand-muted);border-radius:4px;overflow:hidden;align-self:start}
.lang button{border:0;background:none;padding:5px 12px;font-size:13px;font-weight:500;color:var(--brand-muted)}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
@media (max-width:640px){.band .wrap{grid-template-columns:auto 1fr}.lang{grid-column:1/-1;justify-self:start;grid-row:1}.mono{width:56px;height:56px;font-size:20px}}

/* layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-block:28px 48px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:1fr}}
aside{display:grid;gap:16px;position:sticky;top:16px}
@media (max-width:880px){aside{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.panel h3{margin:0 0 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
main{display:grid;gap:16px;min-width:0}
main .panel{padding:24px 28px}
@media (max-width:560px){main .panel{padding:20px}}
h2{margin:0 0 16px;font-size:20px;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--line)}

/* contact */
.contact{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;font-size:14px;min-width:0}
.crow svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}
.crow span{overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:none;border-radius:4px;padding:2px 8px;font-size:12px;color:var(--muted)}
.copy:hover{border-color:var(--accent);color:var(--accent)}

/* skills */
.meter{display:grid;gap:12px}
.m-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px}
.m-row small{color:var(--muted);font-size:12.5px}
.bar{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.list li{display:flex;justify-content:space-between;gap:10px}
.list li span{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:3px 9px;background:var(--bg)}

/* profile */
.lead{margin:0;max-width:72ch}

/* experience */
.job{border-top:1px solid var(--line);padding-block:18px}
.job:first-of-type{border-top:0;padding-top:0}
.jh{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;text-align:left;background:none;border:0;padding:0}
.jh .t{font-weight:600;font-size:17px}
.jh .d{color:var(--muted);font-size:14px;white-space:nowrap}
.jh .o{color:var(--accent);font-weight:500;font-size:15px}
.jh .tg{grid-row:1/3;grid-column:3;align-self:center;width:26px;height:26px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center}
.jh .tg svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.jh[aria-expanded="true"] .tg svg{transform:rotate(180deg)}
.jh{grid-template-columns:1fr auto auto}
@media (max-width:560px){.jh{grid-template-columns:1fr auto}.jh .d{grid-column:1;grid-row:3;white-space:normal}.jh .tg{grid-column:2;grid-row:1/4}}
.badge{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:1px 7px;vertical-align:2px}
.jb{margin-top:12px}
.jb ul{margin:0;padding-left:18px;display:grid;gap:6px}
.jb li::marker{color:var(--muted)}
.sub{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rep{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.rep b{display:block;font-size:14px;font-weight:600}
.rep span{font-size:13px;color:var(--muted)}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brands span{font-size:13.5px;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:4px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* thesis & projects */
.thesis{border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:18px}
.thesis small{color:var(--muted);font-size:13px;font-weight:500}
.thesis p.tt{margin:4px 0 6px;font-weight:600;font-size:16.5px;line-height:1.4;text-wrap:balance}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;margin:0;padding:0;list-style:none}
.proj li{font-size:14.5px}
.proj b{display:block;font-weight:600}
.proj span{color:var(--muted)}
.edu{display:grid;gap:14px}
.edu div{display:grid;grid-template-columns:1fr auto;gap:0 16px}
.edu b{font-weight:600}
.edu span{color:var(--muted);font-size:14px}
.edu .d{color:var(--muted);font-size:14px;grid-row:1}
footer{padding-block:20px 32px;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:4px;font-size:14px;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  const l=e.target.closest(".lang button");
  if(l){lang=l.dataset.l;try{localStorage.setItem("cv-lang",lang)}catch(_){}render();return}
  const j=e.target.closest("[data-j]");
  if(j){open[j.dataset.j]=j.getAttribute("aria-expanded")!=="true";render();document.querySelector(`[data-j="${j.dataset.j}"]`).focus();return}
  const c=e.target.closest("[data-copy]");
  if(c){const txt=c.dataset.copy;try{navigator.clipboard.writeText(txt).then(()=>toast(T[lang].copied+": "+txt),()=>toast(txt))}catch(_){toast(txt)}}
});
let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2000)}
render();
</script>
</body>
</html>
